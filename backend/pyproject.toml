[project]
name = "smartseed-vision"
version = "0.1.0"
description = "Offline tray detection service for SmartSeed (OWLv2 + OpenCV)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "numpy",
    "scipy",
    "opencv-python-headless",
    "pillow",
    "torch",
    "transformers>=5.4.0,<5.6.0",
    "lerobot[feetech,kinematics,dataset] @ git+https://github.com/huggingface/lerobot.git@e595b79",
]

[dependency-groups]
dev = ["pytest", "httpx"]
# MuJoCo twin of the arm (SMARTSEED_ROBOT=sim); installed by default so the sim tests run in `uv run pytest`
sim = ["mujoco>=3.2", "imageio", "imageio-ffmpeg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests", ".."]  # ".." exposes the repo-level `sim` package (layout + scene.xml)

[tool.uv]
package = false
default-groups = ["dev", "sim"]

# lerobot's own pyproject routes torch to the CUDA index; on macOS that has no wheels.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
